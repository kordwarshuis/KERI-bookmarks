<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KERI bookmarks</title>
  <meta name="description" content="A field guide to KERI search, visualisations, websites, conference videos, meetings, and working documents.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#main">Skip to bookmarks</a>
  <header class="site-header">
    <a class="brand" href="#top">
      <img src="logo.png" alt="KERI Foundation" width="108" height="88">
    </a>
    <nav class="header-nav" id="nav" aria-label="Sections"></nav>
    <label class="filter">
      <span class="visually-hidden">Filter bookmarks</span>
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="2"></circle>
        <path d="M16 16.5 21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
      </svg>
      <input id="filter" type="search" placeholder="Search" aria-describedby="filter-hint">
      <kbd id="filter-hint" class="filter-hint">q</kbd>
    </label>
  </header>
  <section class="hero" id="top">
    <h1 id="page-title">KERI bookmarks</h1>
    <p id="lede">A field guide to KERI search, visualisations, websites, conference videos, meetings, and working documents.</p>
  </section>
  <main id="main">
    <p id="empty" class="empty" hidden>No bookmarks match that filter.</p>
    <noscript>
      <p class="empty">Turn on JavaScript to load the bookmarks.</p>
    </noscript>
  </main>
  <footer class="site-footer">
    <p>KERI bookmarks — an index for the suite.</p>
    <p><a href="https://keri.foundation/">keri.foundation</a></p>
  </footer>
  <script src="bookmarks.js"></script>
  <script src="script.js"></script>
</body>
</html>
